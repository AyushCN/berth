name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "20.x"
  # The unit tests construct crypto.Box explicitly, but anything that loads
  # config (and any future test that does) needs a valid key, so every Go job
  # sets a throwaway one. This value is test-only and never deployed.
  ENCRYPTION_KEY: 0d71f78929e8b688442387dd10478006998c1fa490c42c02c627a3e5ec8a3bed

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: berth
          POSTGRES_PASSWORD: berth
          POSTGRES_DB: berth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l backend/)
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files (run gofmt -w backend/):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: cd backend && go vet ./...

      - name: sqlc sync check
        run: |
          curl -sL https://github.com/sqlc-dev/sqlc/releases/download/v1.27.0/sqlc_1.27.0_linux_amd64.tar.gz | tar xz -C /tmp
          sudo mv /tmp/sqlc /usr/local/bin/
          cd backend && sqlc generate
          if [ -n "$(git status --porcelain -- internal/repository/ queries/)" ]; then
            echo "::error::generated sqlc code is out of sync (run 'cd backend && sqlc generate' and commit the result):"
            git status --porcelain -- internal/repository/ queries/
            exit 1
          fi

      - name: unit tests
        run: cd backend && go test -count=1 ./...
        env:
          DATABASE_URL: postgres://berth:berth@localhost:5432/berth_test?sslmode=disable
          REDIS_URL: redis://localhost:6379

      - name: migration tests
        run: cd backend && go test -count=1 -timeout 5m ./migrations/ -v
        env:
          BERTH_MIGRATION_TEST_DSN: postgres://berth:berth@localhost:5432/postgres?sslmode=disable

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # There is no eslint config in the repo and `next lint` is interactive
      # without one, so typecheck + production build is the gate. The build
      # compiles, lints what it can, type-checks and prerenders every route.
      - name: install
        run: cd frontend && npm ci

      - name: typecheck
        run: cd frontend && npx tsc --noEmit

      - name: production build
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://api.localhost
          NEXT_PUBLIC_WS_URL: ws://api.localhost
