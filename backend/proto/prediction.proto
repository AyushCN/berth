syntax = "proto3";

package berth.prediction;

option go_package = "github.com/AyushCN/berth/backend/proto/gen/go/prediction";

service PredictionService {
  // PredictBuildTime predicts the build time for a workspace
  rpc PredictBuildTime(PredictBuildTimeRequest) returns (PredictionResponse);

  // PredictImageSize predicts the final image size
  rpc PredictImageSize(PredictImageSizeRequest) returns (PredictionResponse);

  // PredictCacheHit predicts whether a build will have a cache hit
  rpc PredictCacheHit(PredictCacheHitRequest) returns (PredictionResponse);

  // PredictFailureRisk predicts the risk of build failure
  rpc PredictFailureRisk(PredictFailureRiskRequest) returns (PredictionResponse);

  // GetPredictionHistory returns prediction history for a workspace
  rpc GetPredictionHistory(GetPredictionHistoryRequest) returns (GetPredictionHistoryResponse);

  // GetModelMetrics returns metrics for the active model
  rpc GetModelMetrics(GetModelMetricsRequest) returns (GetModelMetricsResponse);

  // RetrainModel triggers model retraining
  rpc RetrainModel(RetrainModelRequest) returns (RetrainModelResponse);

  // ExportModelONNX exports a model to ONNX format
  rpc ExportModelONNX(ExportModelONNXRequest) returns (ExportModelONNXResponse);

  // ActivateModel activates a model for predictions
  rpc ActivateModel(ActivateModelRequest) returns (ActivateModelResponse);

  // ListModels lists all models
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
}

message PredictBuildTimeRequest {
  string workspace_id = 1;
  map<string, string> features = 2;
}

message PredictImageSizeRequest {
  string workspace_id = 1;
  map<string, string> features = 2;
}

message PredictCacheHitRequest {
  string workspace_id = 1;
  map<string, string> features = 2;
}

message PredictFailureRiskRequest {
  string workspace_id = 1;
  map<string, string> features = 2;
}

message GetPredictionHistoryRequest {
  string workspace_id = 1;
  string prediction_type = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetPredictionHistoryResponse {
  repeated Prediction predictions = 1;
}

message GetModelMetricsRequest {
  string prediction_type = 1;
}

message GetModelMetricsResponse {
  map<string, double> metrics = 1;
}

message RetrainModelRequest {
  string prediction_type = 1;
  string algorithm = 2;
}

message RetrainModelResponse {
  Model model = 1;
}

message ExportModelONNXRequest {
  string model_id = 1;
}

message ExportModelONNXResponse {
  string onnx_path = 1;
}

message ActivateModelRequest {
  string model_id = 1;
}

message ActivateModelResponse {
  bool success = 1;
}

message ListModelsRequest {
  string prediction_type = 1;
}

message ListModelsResponse {
  repeated Model models = 1;
}

message PredictionResponse {
  string prediction_id = 1;
  string prediction_type = 2;
  map<string, string> input = 3;
  map<string, string> output = 4;
  double confidence = 5;
  string model_version = 6;
  int64 created_at = 7;
}

message Model {
  string model_id = 1;
  string name = 2;
  string version = 3;
  string prediction_type = 4;
  string algorithm = 5;
  map<string, string> parameters = 6;
  map<string, double> metrics = 7;
  string onnx_path = 8;
  bool is_active = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

message Prediction {
  string prediction_id = 1;
  string prediction_type = 2;
  string workspace_id = 3;
  map<string, string> input = 4;
  map<string, string> output = 5;
  double confidence = 6;
  string model_version = 7;
  int64 created_at = 8;
}