services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: berth
      POSTGRES_PASSWORD: berth
      POSTGRES_DB: berth
    volumes:
      - berth_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berth -d berth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - berth

  redis:
    image: redis:7-alpine
    volumes:
      - berth_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - berth

  traefik:
    image: traefik:v2.11
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - berth
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    environment:
      MODE: api
      PORT: "8080"
      DATABASE_URL: postgres://berth:berth@postgres:5432/berth?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production_at_least_32_chars_long}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0d71f78929e8b688442387dd10478006998c1fa490c42c02c627a3e5ec8a3bed}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-dev_client_id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-dev_client_secret}
      FRONTEND_URL: http://localhost:3000
      WORKSPACE_ROOT: /home/swordrookie/berth-data/workspaces
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_NETWORK: berth
      TRAEFIK_DOMAIN: localhost
      ENV: development
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/swordrookie/berth-data/workspaces:/home/swordrookie/berth-data/workspaces
    networks:
      - berth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      MODE: worker
      DATABASE_URL: postgres://berth:berth@postgres:5432/berth?sslmode=disable
      REDIS_URL: redis://redis:6379
      WORKSPACE_ROOT: /home/swordrookie/berth-data/workspaces
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_NETWORK: berth
      TRAEFIK_DOMAIN: localhost
      ENV: development
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/swordrookie/berth-data/workspaces:/home/swordrookie/berth-data/workspaces
    networks:
      - berth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api.localhost
    ports:
      - "3000:3000"
    networks:
      - berth
    depends_on:
      - api

volumes:
  berth_pg:
  berth_redis:

networks:
  berth:
    driver: bridge